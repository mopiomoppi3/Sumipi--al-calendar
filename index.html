<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root{
  --rose:#e8698a; --deep:#c0496d; --blush:#f2a7c3;
  --petal:#fde8f0; --cream:#fff5f8; --card:#ffffffee;
  --text:#2d1220; --sub:#7a4a5e; --muted:#b088a0;
  --border:rgba(192,73,109,0.12);
  --shadow-sm:0 1px 4px rgba(192,73,109,0.08),0 4px 16px rgba(192,73,109,0.10);
  --shadow-md:0 4px 12px rgba(192,73,109,0.10),0 16px 40px rgba(192,73,109,0.13);
  --shadow-lg:0 8px 24px rgba(192,73,109,0.12),0 32px 64px rgba(192,73,109,0.18);
  --g1:rgba(242,167,195,0.16); --g2:rgba(235,210,245,0.18); --g3:rgba(248,215,228,0.12);
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:28px;
}
[data-theme=lavender]{
  --rose:#9b6fd4; --deep:#6e3fa8; --blush:#c9aaee;
  --petal:#ede4fb; --cream:#f8f4ff; --card:#fdfbffee;
  --text:#1e1030; --sub:#5a3a8a; --muted:#9a80c0;
  --border:rgba(110,63,168,0.10);
  --shadow-sm:0 1px 4px rgba(110,63,168,0.07),0 4px 16px rgba(110,63,168,0.09);
  --shadow-md:0 4px 12px rgba(110,63,168,0.09),0 16px 40px rgba(110,63,168,0.12);
  --shadow-lg:0 8px 24px rgba(110,63,168,0.11),0 32px 64px rgba(110,63,168,0.16);
  --g1:rgba(201,170,238,0.16); --g2:rgba(180,145,230,0.14); --g3:rgba(220,200,250,0.12);
}
[data-theme=mint]{
  --rose:#3daa88; --deep:#1f7a60; --blush:#8ed8c0;
  --petal:#ddf4ec; --cream:#f2fcf9; --card:#f8fefdee;
  --text:#082820; --sub:#1a5a48; --muted:#70a898;
  --border:rgba(31,122,96,0.10);
  --shadow-sm:0 1px 4px rgba(31,122,96,0.07),0 4px 16px rgba(31,122,96,0.09);
  --shadow-md:0 4px 12px rgba(31,122,96,0.09),0 16px 40px rgba(31,122,96,0.11);
  --shadow-lg:0 8px 24px rgba(31,122,96,0.10),0 32px 64px rgba(31,122,96,0.15);
  --g1:rgba(142,216,192,0.16); --g2:rgba(100,200,170,0.14); --g3:rgba(180,240,220,0.12);
}
[data-theme=peach]{
  --rose:#e88a50; --deep:#c05e28; --blush:#f5c89a;
  --petal:#fdeede; --cream:#fff8f2; --card:#fffaf6ee;
  --text:#2d1408; --sub:#8a4010; --muted:#c09060;
  --border:rgba(192,94,40,0.10);
  --shadow-sm:0 1px 4px rgba(192,94,40,0.07),0 4px 16px rgba(192,94,40,0.09);
  --shadow-md:0 4px 12px rgba(192,94,40,0.09),0 16px 40px rgba(192,94,40,0.11);
  --shadow-lg:0 8px 24px rgba(192,94,40,0.10),0 32px 64px rgba(192,94,40,0.15);
  --g1:rgba(245,200,154,0.16); --g2:rgba(240,178,128,0.14); --g3:rgba(250,220,180,0.12);
}
[data-theme=sky]{
  --rose:#4a9fd4; --deep:#1a72a8; --blush:#99cff5;
  --petal:#ddeeff; --cream:#f2f8ff; --card:#f8fcffee;
  --text:#08182e; --sub:#1a4a78; --muted:#6090c0;
  --border:rgba(26,114,168,0.10);
  --shadow-sm:0 1px 4px rgba(26,114,168,0.07),0 4px 16px rgba(26,114,168,0.09);
  --shadow-md:0 4px 12px rgba(26,114,168,0.09),0 16px 40px rgba(26,114,168,0.11);
  --shadow-lg:0 8px 24px rgba(26,114,168,0.10),0 32px 64px rgba(26,114,168,0.15);
  --g1:rgba(153,207,245,0.16); --g2:rgba(130,188,240,0.14); --g3:rgba(180,220,255,0.12);
}

/* ── RESET ───────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Zen Maru Gothic',sans-serif;
  background:var(--cream); color:var(--text);
  min-height:100vh; overflow-x:hidden;
  transition:background .5s var(--ease-out),color .5s var(--ease-out);
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 60% at 15% 15%,var(--g1),transparent),
    radial-gradient(ellipse 60% 50% at 85% 85%,var(--g2),transparent),
    radial-gradient(ellipse 50% 40% at 65% 5%,var(--g3),transparent);
  transition:background .5s var(--ease-out);
}

/* ── HEADER — liquid glass ───────────────────────────────────── */
.header{
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; height:52px; padding:0 16px; gap:10px;
  background:rgba(255,245,248,0.72);
  backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,0.5);
  box-shadow:0 1px 0 var(--border);
}
[data-theme=lavender] .header{background:rgba(248,244,255,0.72);}
[data-theme=mint]     .header{background:rgba(242,252,249,0.72);}
[data-theme=peach]    .header{background:rgba(255,248,242,0.72);}
[data-theme=sky]      .header{background:rgba(242,248,255,0.72);}
.header h1{
  font-family:'Klee One',cursive; font-size:1.18rem; font-weight:600;
  color:var(--deep); letter-spacing:.04em; flex:1;
  /* optical: tighten slightly at this size */
}

/* theme button */
.theme-wrap{position:relative;}
.theme-btn{
  width:30px; height:30px; border-radius:50%; border:2px solid rgba(255,255,255,0.7);
  background:linear-gradient(135deg,var(--blush),var(--rose));
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px var(--border);
  transition:transform .18s var(--spring), box-shadow .18s;
  will-change:transform;
}
.theme-btn:active{transform:scale(0.88);transition-duration:.1s;}
.theme-btn svg{width:14px;height:14px;}
.theme-panel{
  position:absolute; top:38px; right:0;
  background:var(--card);
  backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:16px; padding:12px 14px; gap:10px;
  box-shadow:var(--shadow-md);
  display:none; flex-direction:column; z-index:200; min-width:138px;
  transform-origin:top right;
}
.theme-panel.open{
  display:flex;
  animation:panelIn .22s var(--spring) both;
}
@keyframes panelIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.theme-panel-label{font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.swatches{display:flex;gap:7px;align-items:center;}
.swatch{
  width:20px;height:20px;border-radius:50%;
  border:2.5px solid transparent; cursor:pointer; outline:none;
  transition:transform .18s var(--spring),border-color .15s;
  will-change:transform;
}
.swatch:active{transform:scale(.85)!important;}
.swatch.active{border-color:var(--text);transform:scale(1.22);}
.sw-pink    {background:linear-gradient(135deg,#f2a7c3,#e8698a);}
.sw-lavender{background:linear-gradient(135deg,#c9aaee,#9b6fd4);}
.sw-mint    {background:linear-gradient(135deg,#8ed8c0,#3daa88);}
.sw-peach   {background:linear-gradient(135deg,#f5c89a,#e88a50);}
.sw-sky     {background:linear-gradient(135deg,#99cff5,#4a9fd4);}

/* ── BOTTOM TAB BAR — pill style ─────────────────────────────── */
.tab-bar{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:100;
  display:flex; align-items:center; justify-content:center;
  height:64px;
  padding:0 8px;
  gap:4px;
  background:rgba(255,245,248,0.82);
  backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 4px 24px rgba(192,73,109,0.14), 0 1px 0 rgba(255,255,255,0.5) inset;
  /* don't stretch full width */
  width:340px; max-width:calc(100vw - 40px);
}
[data-theme=lavender] .tab-bar{background:rgba(248,244,255,0.82);}
[data-theme=mint]     .tab-bar{background:rgba(242,252,249,0.82);}
[data-theme=peach]    .tab-bar{background:rgba(255,248,242,0.82);}
[data-theme=sky]      .tab-bar{background:rgba(242,248,255,0.82);}

.tab-item{
  flex:1; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; border:none; cursor:pointer;
  font-family:'Zen Maru Gothic',sans-serif; font-size:.62rem; font-weight:600; letter-spacing:.02em;
  color:var(--muted); background:transparent;
  height:52px; border-radius:999px;
  padding:0 4px;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  transition:color .18s var(--ease-out), background .18s var(--ease-out), box-shadow .18s var(--ease-out), transform .14s var(--spring);
  will-change:transform;
}
.tab-item svg{
  width:20px; height:20px; stroke-width:1.9; flex-shrink:0;
  transition:transform .28s var(--spring);
  will-change:transform;
}
.tab-label{
  /* always visible */
}
.tab-item{position:relative;z-index:1;}
.tab-item.active{color:#fff;}
/* sliding pill */
.tab-pill{
  position:absolute; top:5px; left:0; height:52px; width:0;
  border-radius:999px; background:var(--rose);
  box-shadow:0 4px 16px rgba(232,105,138,0.35);
  pointer-events:none; z-index:0;
  /* 出だしが速く、終わりでキュッと止まる。反動は小さく短く */
  transition:
    left  .32s cubic-bezier(0.14,1.25,0.3,1.0),
    width .40s cubic-bezier(0.16,1.15,0.3,1.0),
    background .3s;
  will-change:left,width;
}
.tab-pill.no-anim{transition:none;}
[data-theme=lavender] .tab-pill{box-shadow:0 4px 16px rgba(155,111,212,0.35);}
[data-theme=mint]     .tab-pill{box-shadow:0 4px 16px rgba(61,170,136,0.35);}
[data-theme=peach]    .tab-pill{box-shadow:0 4px 16px rgba(232,138,80,0.35);}
[data-theme=sky]      .tab-pill{box-shadow:0 4px 16px rgba(74,159,212,0.35);}
.tab-item.active svg{transform:scale(1.06);}
.tab-item:active{transform:scale(.91);}
.tab-item:not(.active):active svg{transform:scale(.84);}


/* ── LAYOUT ──────────────────────────────────────────────────── */
.app{max-width:900px;margin:0 auto;padding:14px 16px 104px;position:relative;z-index:1;}
.section{display:none;}
.section.active{display:block;animation:sectionIn .3s var(--ease-out) both;}
@keyframes sectionIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── CARDS ───────────────────────────────────────────────────── */
.persons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:14px;}
.person-card{
  background:var(--card);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:var(--r-lg); padding:18px;
  box-shadow:var(--shadow-sm);
  cursor:pointer; position:relative; overflow:hidden;
  transition:transform .22s var(--spring), box-shadow .22s var(--ease-out);
  will-change:transform;
}
.person-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2.5px;
  background:linear-gradient(90deg,var(--blush),var(--rose));
  border-radius:var(--r-lg) var(--r-lg) 0 0;
}
/* instant press feedback on pointerdown */
.person-card:active{transform:scale(.97);box-shadow:var(--shadow-sm);}
.person-card.lifted{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.p-dot{width:26px;height:26px;border-radius:50%;margin-bottom:10px;flex-shrink:0;}
.p-name{font-weight:700;font-size:.98rem;color:var(--text);letter-spacing:-.01em;}
.p-since{font-size:.68rem;color:var(--muted);margin-top:3px;}
.p-days{
  margin-top:9px; font-size:1.5rem;
  font-family:'Klee One',cursive; font-weight:600; color:var(--rose);
  letter-spacing:-.02em; /* tighten large numerals */
  line-height:1;
}
.p-days span{font-size:.62rem;color:var(--muted);font-family:'Zen Maru Gothic',sans-serif;letter-spacing:0;}
.p-like{font-size:.68rem;color:var(--muted);margin-top:3px;}
.del-btn{
  position:absolute;top:10px;right:11px;
  background:rgba(0,0,0,0);border:none;
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:var(--muted);cursor:pointer;
  opacity:0;transition:opacity .15s,background .15s,transform .12s var(--spring);
}
.person-card:hover .del-btn{opacity:1;}
.del-btn:active{transform:scale(.82);background:var(--petal);}

/* add new */
.btn-add-new{
  width:100%;padding:13px;border-radius:var(--r-md);
  border:1.5px dashed var(--blush); background:transparent;
  color:var(--muted); font-family:'Zen Maru Gothic',sans-serif; font-size:.88rem;
  cursor:pointer;
  transition:background .18s,color .18s,border-color .18s,transform .14s var(--spring);
  will-change:transform;
}
.btn-add-new:active{transform:scale(.97);}
.btn-add-new:hover{background:var(--petal);color:var(--rose);border-color:var(--rose);}

/* ── ADD FORM ────────────────────────────────────────────────── */
.add-card{
  background:var(--card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.65);
  border-radius:var(--r-lg); padding:22px;
  box-shadow:var(--shadow-md);
  border-top:1.5px dashed var(--blush);
  margin-bottom:14px;
  animation:sectionIn .28s var(--ease-out) both;
}
.add-card h2{font-size:.95rem;color:var(--text);margin-bottom:16px;font-weight:600;letter-spacing:-.01em;}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px;}
label{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
input[type=text],input[type=date],textarea{
  border:1.5px solid var(--petal); border-radius:var(--r-sm);
  padding:9px 12px; font-family:'Zen Maru Gothic',sans-serif; font-size:.87rem;
  color:var(--text); background:rgba(255,255,255,0.8); outline:none;
  transition:border-color .18s,box-shadow .18s;
}
input:focus,textarea:focus{
  border-color:var(--rose);
  box-shadow:0 0 0 3px rgba(232,105,138,0.12);
}
textarea{resize:vertical;min-height:70px;}

/* color picker */
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.color-opt{
  width:22px;height:22px;border-radius:50%;
  border:3px solid transparent; cursor:pointer; display:inline-block;
  transition:transform .18s var(--spring),border-color .15s;
  will-change:transform;
}
.color-opt:active{transform:scale(.82)!important;}
.color-opt.selected{border-color:var(--text);transform:scale(1.2);}

/* buttons */
.btn{
  padding:9px 20px; border-radius:999px; border:none;
  font-family:'Zen Maru Gothic',sans-serif; font-size:.87rem; font-weight:700;
  cursor:pointer;
  transition:transform .15s var(--spring),box-shadow .18s,filter .18s;
  will-change:transform;
}
.btn:active{transform:scale(.94)!important;}
.btn-primary{background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;}
.btn-primary:hover{box-shadow:0 4px 14px var(--border);filter:brightness(1.04);}
.btn-secondary{background:var(--petal);color:var(--rose);}
.btn-secondary:hover{background:var(--blush);color:#fff;}

/* range */
.like-row{display:flex;align-items:center;gap:10px;margin:6px 0;}
.like-row input[type=range]{flex:1;padding:0;accent-color:var(--rose);border:none;height:4px;cursor:pointer;}
.like-lbl{font-size:.68rem;color:var(--muted);font-weight:500;}
.like-val{font-weight:700;color:var(--rose);font-size:.95rem;min-width:26px;text-align:right;font-variant-numeric:tabular-nums;}

/* ── CALENDAR ────────────────────────────────────────────────── */
.cal-person-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.cal-tab{
  padding:5px 13px; border-radius:999px;
  border:1.5px solid var(--blush); background:rgba(255,255,255,0.6);
  color:var(--sub); font-size:.76rem; font-family:'Zen Maru Gothic',sans-serif;
  cursor:pointer; display:flex; align-items:center; gap:5px;
  transition:transform .15s var(--spring),background .16s,color .16s,border-color .16s;
  will-change:transform;
}
.cal-tab:active{transform:scale(.93);}
.cal-tab.active{color:#fff;}
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.nav-btn{
  width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--blush); background:rgba(255,255,255,0.7);
  color:var(--rose); cursor:pointer; font-size:.95rem;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--spring),background .16s,color .16s;
  will-change:transform;
}
.nav-btn:active{transform:scale(.86);}
.nav-btn:hover{background:var(--rose);color:#fff;border-color:var(--rose);}
.month-label{
  font-family:'Klee One',cursive; font-size:.98rem; color:var(--deep);
  min-width:88px; text-align:center; letter-spacing:.01em;
}

/* grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px;}
.cal-dow{text-align:center;font-size:.6rem;color:var(--muted);padding:3px 0;font-weight:600;letter-spacing:.04em;}
.cal-dow:first-child{color:#d45050;}
.cal-dow:last-child {color:#4060c0;}
.cal-cell{
  min-height:62px; border-radius:var(--r-sm); padding:4px 5px;
  background:rgba(255,255,255,0.7);
  border:1px solid var(--border); cursor:pointer;
  transition:transform .14s var(--spring),box-shadow .15s,background .15s;
  position:relative; display:flex; flex-direction:column;
  will-change:transform;
}
.cal-cell:active{transform:scale(.93);box-shadow:var(--shadow-sm);}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none;}
.cal-cell.today{border-color:var(--rose);background:var(--petal);}
.cal-cell.has-entry{background:var(--petal);}
.cal-cell.has-entry::after{
  content:''; position:absolute; bottom:3px; right:3px;
  width:5px; height:5px; border-radius:50%; background:var(--rose);
}
.cal-date{font-size:.66rem;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.01em;}
.cal-cell.sun .cal-date{color:#d45050;}
.cal-cell.sat .cal-date{color:#4060c0;}
.cal-thumb{width:100%;flex:1;object-fit:cover;border-radius:5px;margin-top:3px;display:block;}
.cal-like-bar{height:3px;border-radius:999px;background:var(--blush);margin-top:3px;overflow:hidden;}
.cal-like-fill{height:100%;border-radius:999px;background:var(--rose);}
.cal-mood-text{font-size:.6rem;color:var(--sub);margin-top:2px;line-height:1.2;}
.cal-mark{
  display:inline-block;width:11px;height:11px;border-radius:2px;
  margin-left:2px;vertical-align:middle;font-size:.48rem;
  color:#fff;text-align:center;line-height:11px;font-weight:700;
}
.cal-legend{display:flex;gap:10px;font-size:.68rem;color:var(--muted);margin-top:2px;flex-wrap:wrap;}
.cal-legend span{display:flex;align-items:center;gap:4px;}

/* ── DAY MODAL ───────────────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;
  background:rgba(20,8,14,.32);
  backdrop-filter:blur(8px) saturate(120%);
  -webkit-backdrop-filter:blur(8px) saturate(120%);
  z-index:400;display:flex;align-items:flex-end;justify-content:center;
  padding:0 0 env(safe-area-inset-bottom,0);
}
.overlay.center{align-items:center;padding:16px;}
.day-modal{
  background:var(--card);
  backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid rgba(255,255,255,0.65);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:20px 20px 32px; width:100%; max-width:500px; max-height:88vh; overflow-y:auto;
  box-shadow:var(--shadow-lg);
  /* spring slide-up from bottom */
  animation:sheetUp .38s var(--spring) both;
}
.day-modal.center-modal{border-radius:var(--r-xl);animation:modalPop .3s var(--spring) both;}
@keyframes sheetUp{from{transform:translateY(100%);opacity:.6}to{transform:none;opacity:1}}
@keyframes modalPop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;}
.dm-head{margin-bottom:14px;}
.dm-head h2{font-family:'Klee One',cursive;font-size:1.05rem;color:var(--text);font-weight:600;letter-spacing:-.01em;}
.dm-badge{
  display:inline-flex;align-items:center;gap:5px;margin-top:4px;
  padding:3px 10px 3px 6px; border-radius:999px;
  background:var(--petal); font-size:.72rem; color:var(--rose); font-weight:600;
}
.dm-badge .dot{width:8px;height:8px;border-radius:50%;}

/* sections inside modal */
.esec{margin-bottom:14px;}
.esec-title{font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
.exist-card{
  background:rgba(255,255,255,0.6);border:1px solid var(--border);
  border-radius:var(--r-md);padding:12px;margin-bottom:8px;
}
.exist-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.exist-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.exist-mood{font-size:.78rem;color:var(--sub);font-weight:600;}
.exist-like{font-size:.72rem;color:var(--rose);font-weight:700;}
.exist-text{font-size:.82rem;line-height:1.65;color:var(--text);}
.exist-img{width:100%;border-radius:var(--r-sm);margin-top:8px;object-fit:cover;max-height:140px;display:block;}
.e-del{
  background:none;border:none;cursor:pointer;
  font-size:.72rem;color:var(--muted);padding:4px 8px;border-radius:8px;
  transition:background .15s,color .15s,transform .12s var(--spring);
  will-change:transform;
}
.e-del:active{transform:scale(.88);}
.e-del:hover{background:var(--petal);color:var(--deep);}

.mood-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.mood-btn{
  padding:5px 11px;border-radius:999px;
  border:1.5px solid var(--petal);background:rgba(255,255,255,0.8);
  font-size:.8rem;font-family:'Zen Maru Gothic',sans-serif;color:var(--sub);
  cursor:pointer;
  transition:transform .13s var(--spring),background .15s,border-color .15s;
  will-change:transform;
}
.mood-btn:active{transform:scale(.9);}
.mood-btn.sel{border-color:var(--rose);background:var(--petal);color:var(--rose);font-weight:600;}

.photo-upload label{
  display:inline-block;padding:7px 14px;border-radius:999px;
  border:1.5px solid var(--blush);background:rgba(255,255,255,0.8);color:var(--rose);
  font-size:.78rem;cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;font-weight:600;
  transition:transform .13s var(--spring),background .15s;
  will-change:transform;
}
.photo-upload label:active{transform:scale(.94);}
.photo-upload label:hover{background:var(--petal);}
.photo-upload input{display:none;}

.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}

/* ── STATS ───────────────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:16px;}
.stat-card{
  background:var(--card); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.65);
  border-radius:var(--r-md); padding:16px;
  box-shadow:var(--shadow-sm); text-align:center;
}
.stat-num{
  font-family:'Klee One',cursive;font-size:1.9rem;color:var(--deep);
  font-weight:600;letter-spacing:-.03em;line-height:1;
}
.stat-label{font-size:.7rem;color:var(--muted);margin-top:4px;letter-spacing:.01em;}
.person-stat{
  background:var(--card); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.65);
  border-radius:var(--r-md); padding:16px; margin-bottom:10px;
  box-shadow:var(--shadow-sm);
}
.ps-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ps-name{font-weight:700;color:var(--text);font-size:.93rem;display:flex;align-items:center;gap:7px;}
.ps-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ps-days{font-size:.72rem;color:var(--muted);}
.like-bar{height:5px;border-radius:999px;background:var(--petal);overflow:hidden;margin:8px 0 4px;}
.like-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blush),var(--rose));transition:width .6s var(--ease-out);}

/* ── EMPTY ───────────────────────────────────────────────────── */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-line{width:32px;height:2px;background:var(--petal);border-radius:1px;margin:0 auto 14px;}
.empty p{font-size:.86rem;line-height:1.6;}

/* ── CONFIRM ─────────────────────────────────────────────────── */
.conf-modal{
  background:var(--card); backdrop-filter:blur(10px) saturate(150%);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  border:1px solid rgba(255,255,255,0.65);
  border-radius:var(--r-xl); padding:24px; max-width:340px; width:100%;
  box-shadow:var(--shadow-lg); animation:modalPop .28s var(--spring) both;
}
.conf-modal h2{font-size:1rem;color:var(--text);margin-bottom:6px;font-weight:600;}
.conf-modal p{font-size:.8rem;color:var(--muted);margin-bottom:18px;line-height:1.6;}

/* ── v4: blur fix, white theme, header, popover ─────────────── */
[data-theme=white]{--rose:#1c1c1e;--deep:#000;--blush:#d1d1d6;--petal:#f2f2f7;--cream:#fff;--card:#fffffff0;--text:#1c1c1e;--sub:#5c5c60;--muted:#8e8e93;--border:rgba(0,0,0,.08);--shadow-sm:0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.07),0 16px 40px rgba(0,0,0,.09);--shadow-lg:0 8px 24px rgba(0,0,0,.09),0 32px 64px rgba(0,0,0,.12);--g1:rgba(0,0,0,.03);--g2:rgba(0,0,0,.02);--g3:rgba(0,0,0,.015);}
[data-theme=white] .tab-pill{box-shadow:0 4px 14px rgba(0,0,0,.22);}
/* 背景を半透明にして、下のコンテンツが本当にぼけて透けるように */
.header.header,.tab-bar.tab-bar{background:color-mix(in srgb,var(--cream) 50%,transparent);backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);}
.hdr-actions{display:flex;gap:8px;align-items:center;}
.hdr-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:color-mix(in srgb,var(--cream) 70%,transparent);color:var(--rose);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 6px var(--border);transition:transform .15s var(--spring);}
.hdr-btn:active{transform:scale(.86);}
.hdr-btn svg{width:17px;height:17px;}
.theme-panel{top:42px;min-width:240px;padding:14px;}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;}
.chip{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:inherit;font-size:.64rem;color:var(--sub);transition:transform .15s var(--spring);}
.chip:active{transform:scale(.9);}
.chip i{width:34px;height:34px;border-radius:50%;display:block;border:3px solid transparent;box-shadow:0 0 0 1px var(--border) inset;transition:transform .25s var(--spring),border-color .15s;}
.chip.active i{border-color:var(--text);transform:scale(1.06);}
.chip.active{color:var(--text);font-weight:600;}
.c-white{background:#fff;}
@media (hover:none){.del-btn{opacity:.55;}}
.today-btn{margin-left:auto;padding:5px 13px;border-radius:999px;border:1.5px solid var(--blush);background:color-mix(in srgb,var(--cream) 70%,transparent);color:var(--rose);font:600 .72rem 'Zen Maru Gothic',sans-serif;cursor:pointer;transition:transform .14s var(--spring);}
.today-btn:active{transform:scale(.92);}

/* ── v5: features ── */
.p-mile{font-size:.66rem;color:var(--sub);margin-top:8px;padding:4px 9px;border-radius:999px;background:var(--petal);display:inline-block;}
.p-quick{display:block;width:100%;margin-top:10px;padding:8px 0;border-radius:999px;border:none;background:var(--qc,var(--rose));color:#fff;font:700 .74rem 'Zen Maru Gothic',sans-serif;cursor:pointer;transition:transform .14s var(--spring);}
.p-quick:active{transform:scale(.94);}
.month-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.month-sum div{background:var(--card);border:1px solid rgba(255,255,255,.65);border-radius:var(--r-md);padding:12px 6px;text-align:center;box-shadow:var(--shadow-sm);}
.month-sum b{display:block;font-family:'Klee One',cursive;font-size:1.4rem;color:var(--deep);letter-spacing:-.02em;line-height:1.1;}
.month-sum span{font-size:.62rem;color:var(--muted);}
.month-photos{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scroll-snap-type:x proximity;}
.month-photos img{width:84px;height:84px;object-fit:cover;border-radius:var(--r-sm);flex-shrink:0;scroll-snap-align:start;cursor:pointer;transition:transform .14s var(--spring);}
.month-photos img:active{transform:scale(.94);}

/* ── v6 ── */
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin-bottom:10px;flex-shrink:0;}
.set-person .av{margin:0;}
.p-rel{margin-left:6px;font-size:.58rem;font-weight:600;color:var(--rose);background:var(--petal);padding:2px 7px;border-radius:999px;vertical-align:middle;}
.p-mutual{display:block;width:100%;margin-top:6px;padding:7px 0;border-radius:999px;border:1.5px solid var(--rose);background:transparent;color:var(--rose);font:700 .72rem 'Zen Maru Gothic',sans-serif;cursor:pointer;transition:transform .14s var(--spring);}
.p-mutual:active{transform:scale(.94);}
.sel{border:1.5px solid var(--petal);border-radius:12px;padding:8px 10px;font:inherit;font-size:.82rem;background:rgba(255,255,255,.85);color:var(--text);outline:none;}
.file-in{font-size:.78rem;border:none!important;padding:6px 0!important;background:none!important;}
.set-group{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.65);border-radius:var(--r-lg);padding:6px 16px 10px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.set-title{font-size:.66rem;color:var(--muted);font-weight:600;letter-spacing:.05em;padding:10px 0 2px;}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:.86rem;}
.set-row:last-child{border-bottom:none;}
.tg{position:relative;width:46px;height:28px;flex-shrink:0;}
.tg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1;}
.tg i{position:absolute;inset:0;border-radius:999px;background:var(--blush);transition:background .2s;}
.tg i::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .32s var(--spring);}
.tg input:checked+i{background:var(--rose);}
.tg input:checked+i::after{transform:translateX(18px);}
.seg{display:flex;background:var(--petal);border-radius:999px;padding:3px;}
.seg button{border:none;background:none;padding:5px 13px;border-radius:999px;font:600 .74rem 'Zen Maru Gothic',sans-serif;color:var(--sub);cursor:pointer;transition:background .2s,color .2s;}
.seg button.on{background:var(--rose);color:#fff;}
.set-person{padding:12px 0;border-bottom:1px solid var(--border);}
.set-person:last-child{border-bottom:none;}
.sp-top{display:flex;align-items:center;gap:10px;}
.sp-btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px;}
.mini{padding:6px 12px;border-radius:999px;border:1.5px solid var(--blush);background:rgba(255,255,255,.7);color:var(--sub);font:600 .7rem 'Zen Maru Gothic',sans-serif;cursor:pointer;}
.mini.hot{border-color:var(--rose);color:var(--rose);}
.song-in{font-size:.78rem!important;padding:8px 11px!important;}
.cele{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,8,14,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .25s ease both;}
.cele-card{background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:var(--r-xl);padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:modalPop .4s var(--spring) both;}
.cele-card h2{font-family:'Klee One',cursive;font-size:1.3rem;color:var(--deep);margin:10px 0 8px;}
.cele-card p{font-size:.84rem;line-height:1.8;color:var(--sub);margin-bottom:18px;}
.cele-card b{color:var(--rose);font-size:1.05rem;}
.cele-heart{width:72px;height:72px;animation:pulse 1s var(--spring) infinite alternate;}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.12)}}
.pt{position:fixed;z-index:700;pointer-events:none;border-radius:2px;will-change:transform;}

/* ── v7: glass pill, dashboard ── */
.tab-bar.tab-bar{width:360px;}
.tab-pill.tab-pill{background:color-mix(in srgb,var(--rose) 18%,transparent);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);box-shadow:0 2px 10px var(--border),inset 0 1px 0 rgba(255,255,255,.55);}
.tab-item.active{color:var(--deep);}
body.no-dash #ti-dash{display:none;}
.wg{position:relative;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.65);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);animation:sectionIn .3s var(--ease-out) both;}
.wg-x{position:absolute;top:10px;right:12px;border:none;background:none;color:var(--muted);font:600 .68rem 'Zen Maru Gothic',sans-serif;cursor:pointer;padding:4px 6px;border-radius:8px;}
.wg-x:active{background:var(--petal);}
.wg-title{font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.05em;margin-bottom:10px;}
.wg-note{font-size:.8rem;color:var(--sub);line-height:1.7;}
.wx-top{display:flex;align-items:baseline;gap:12px;}
.wx-t{font-family:'Klee One',cursive;font-size:2.6rem;color:var(--deep);letter-spacing:-.03em;line-height:1;}
.wx-l{font-size:.9rem;color:var(--text);font-weight:600;}
.wx-p{font-size:.68rem;color:var(--muted);}
.wx-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);font-size:.8rem;}
.wx-row b{width:34px;color:var(--sub);}.wx-row span{flex:1;color:var(--text);}.wx-row em{font-style:normal;color:var(--muted);font-size:.7rem;}
.mu{display:flex;gap:14px;align-items:center;}
.mu img,.mu .mu-ph{width:84px;height:84px;border-radius:var(--r-md);object-fit:cover;flex-shrink:0;background:var(--petal);box-shadow:var(--shadow-sm);}
.mu-n{font-weight:700;font-size:.95rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mu-a{font-size:.75rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mu-bar{height:4px;border-radius:999px;background:var(--petal);overflow:hidden;margin:10px 0 8px;}
.mu-bar i{display:block;height:100%;background:var(--rose);border-radius:999px;transition:width .6s linear;}
.mu-c{display:flex;gap:10px;align-items:center;}
.mu-c button{width:38px;height:38px;border-radius:50%;border:none;background:var(--petal);color:var(--rose);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .14s var(--spring);}
.mu-c button.main{width:46px;height:46px;background:var(--rose);color:#fff;}
.mu-c button:active{transform:scale(.88);}.mu-c svg{width:18px;height:18px;}
.dash-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.sp-field{width:100%;margin:8px 0 4px;}
.sp-uri{font-size:.66rem;color:var(--muted);word-break:break-all;line-height:1.6;background:var(--petal);padding:8px 10px;border-radius:var(--r-sm);margin-top:6px;}

/* ── v8 ── */
.tab-item svg{stroke-linecap:round;stroke-linejoin:round;}
.chip{outline:none;-webkit-tap-highlight-color:transparent;}
.chip i,.chip.active i{border:none;box-shadow:0 1px 5px rgba(0,0,0,.18);}
.chip.active i{transform:scale(1.2);}
.tab-pill.hide{opacity:0;}
.tab-name{width:120px;padding:7px 11px;font-size:.84rem;}
.crop-c{touch-action:none;display:block;margin:0 auto;border-radius:18px;background:#222;}

/* ── v9: tab-bar-style motion on switches and segmented controls ── */
.tg input:checked+i::after{transform:translateX(18px);}
.tg i::after{transition:transform .32s cubic-bezier(0.14,1.25,0.3,1),width .22s cubic-bezier(0.14,1.25,0.3,1);}
.tg i{transition:background .25s var(--ease-out),transform .16s var(--spring);}
.tg:active i{transform:scale(.95);}
.tg input:active+i::after{width:32px;}
.tg input:checked:active+i::after{transform:translateX(10px);}
.seg{position:relative;}
.seg button{position:relative;z-index:1;background:none;transition:color .25s var(--ease-out),transform .16s var(--spring);}
.seg button.on{background:none;color:var(--deep);}
.seg button:active{transform:scale(.92);}
.seg-pill{position:absolute;top:0;left:0;width:0;height:0;border-radius:999px;pointer-events:none;z-index:0;background:color-mix(in srgb,var(--rose) 18%,transparent);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);box-shadow:0 2px 10px var(--border),inset 0 1px 0 rgba(255,255,255,.55);transition:left .32s cubic-bezier(0.14,1.25,0.3,1),width .40s cubic-bezier(0.16,1.15,0.3,1);}
.seg-pill.no-anim{transition:none;}

/* ── v10: hamburger menu, no top bar ── */
.app{padding-top:calc(56px + env(safe-area-inset-top,0px));}
.menu-wrap{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;z-index:150;}
.menu-btn{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:color-mix(in srgb,var(--cream) 55%,transparent);backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);box-shadow:0 2px 12px var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .16s var(--spring);-webkit-tap-highlight-color:transparent;}
.menu-btn:active{transform:scale(.88);}
.menu-btn span{display:block;width:16px;height:2px;border-radius:2px;background:var(--deep);transition:transform .36s cubic-bezier(0.14,1.25,0.3,1),opacity .2s,width .3s;}
.menu-btn span:nth-child(2){width:10px;align-self:center;}
.menu-wrap.open .menu-btn span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.menu-wrap.open .menu-btn span:nth-child(2){opacity:0;transform:scaleX(.2);}
.menu-wrap.open .menu-btn span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.menu-panel{position:absolute;top:50px;right:0;width:240px;padding:8px;border-radius:24px;background:color-mix(in srgb,var(--cream) 62%,transparent);backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow-md);transform-origin:top right;transform:scale(.82) translateY(-6px);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(0.14,1.25,0.3,1),opacity .18s;}
.menu-wrap.open .menu-panel{transform:none;opacity:1;pointer-events:auto;}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:none;background:none;border-radius:16px;font:600 .88rem 'Zen Maru Gothic',sans-serif;color:var(--text);text-align:left;cursor:pointer;opacity:0;transform:translateY(-8px);transition:transform .38s cubic-bezier(0.14,1.25,0.3,1),opacity .2s,background .15s;}
.menu-wrap.open .menu-item{opacity:1;transform:none;}
.menu-wrap.open .menu-item:nth-of-type(2){transition-delay:.04s;}
.menu-wrap.open .menu-theme{transition-delay:.08s;}
.menu-item:active{background:color-mix(in srgb,var(--rose) 14%,transparent);}
.menu-item svg{width:20px;height:20px;color:var(--rose);flex-shrink:0;}
.menu-sep{height:1px;background:var(--border);margin:4px 10px;}
.menu-theme{display:block;cursor:default;padding:8px 10px 12px;}
.menu-theme:active{background:none;}
.menu-theme .lbl{font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.05em;margin:2px 0 12px;}

/* ── REDUCED MOTION ──────────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:opacity .2s ease!important;transform:none!important;}
  .day-modal,.conf-modal{animation:none;opacity:1;}
}
</style>
</head>
<body>

<div class="menu-wrap theme-wrap" id="menu-wrap">
  <button class="menu-btn" onclick="toggleMenu()" aria-label="メニュー"><span></span><span></span><span></span></button>
  <div class="menu-panel">
    <button class="menu-item" onclick="menuGo(openSettings)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>設定</button>
    <button class="menu-item" onclick="menuGo(openBackup)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg>バックアップ</button>
    <div class="menu-sep"></div>
    <div class="menu-item menu-theme" id="theme-panel"><div class="lbl">テーマカラー</div><div class="chips"><button class="chip active" data-t="pink" onclick="setTheme('pink')"><i class="sw-pink"></i>ピンク</button><button class="chip" data-t="lavender" onclick="setTheme('lavender')"><i class="sw-lavender"></i>ラベンダー</button><button class="chip" data-t="mint" onclick="setTheme('mint')"><i class="sw-mint"></i>ミント</button><button class="chip" data-t="peach" onclick="setTheme('peach')"><i class="sw-peach"></i>ピーチ</button><button class="chip" data-t="sky" onclick="setTheme('sky')"><i class="sw-sky"></i>スカイ</button><button class="chip" data-t="white" onclick="setTheme('white')"><i class="c-white"></i>ホワイト</button></div></div>
  </div>
</div>

<!-- BOTTOM TAB BAR -->
<div class="tab-bar" id="tab-bar">
  <div class="tab-pill no-anim" id="tab-pill"></div>
  <button class="tab-item active" id="ti-home" onclick="showTab('home',this)" aria-label="片思い中">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
      <path d="M9 21V12h6v9"/>
    </svg>
    <span class="tab-label">ホーム</span>
  </button>
  <button class="tab-item" id="ti-cal" onclick="showTab('cal',this)" aria-label="カレンダー">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <rect x="3" y="4" width="18" height="18" rx="5.5"/>
      <path d="M16 2v4M8 2v4M3 10h18"/>
      <circle cx="8" cy="15" r="1" fill="currentColor"/>
      <circle cx="12" cy="15" r="1" fill="currentColor"/>
      <circle cx="16" cy="15" r="1" fill="currentColor"/>
    </svg>
    <span class="tab-label">カレンダー</span>
  </button>
  <button class="tab-item" id="ti-stats" onclick="showTab('stats',this)" aria-label="統計">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M18 20V10M12 20V4M6 20v-6"/>
    </svg>
    <span class="tab-label">統計</span>
  </button>
  <button class="tab-item" id="ti-dash" onclick="showTab('dash',this)" aria-label="ダッシュボード">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7.5" height="9" rx="3.4"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="3"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="3.4"/><rect x="3" y="15" width="7.5" height="6" rx="3"/></svg>
    <span class="tab-label">ダッシュ</span>
  </button>
</div>

<div class="app">
  <div id="tab-home" class="section active">
    <div id="persons-grid" class="persons-grid"></div>
    <div id="add-area"></div>
  </div>
  <div id="tab-cal" class="section">
    <div class="cal-person-tabs" id="cal-person-tabs"></div>
    <div id="cal-song" style="margin-bottom:12px"></div>
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)" aria-label="前月">‹</button>
      <div class="month-label" id="month-label"></div>
      <button class="nav-btn" onclick="changeMonth(1)" aria-label="次月">›</button>
      <button class="today-btn" onclick="goToday()">今日</button>
    </div>

  </div>

    <div id="stats-content"></div>
  </div>
  <div id="tab-dash" class="section"><div id="dash-content"></div></div>
  <div id="tab-set" class="section"><div id="set-content"></div></div>
</div>

<!-- DAY SHEET -->
<div id="day-overlay" class="overlay" style="display:none">
  <div class="day-modal" id="day-modal-inner">
    <div class="sheet-handle"></div>
    <div class="dm-head">
      <h2 id="dm-title"></h2>
      <div class="dm-badge" id="dm-badge"><span class="dot" id="dm-dot"></span><span id="dm-person"></span></div>

<!-- CONFIRM -->
<div id="conf-overlay" class="overlay center" style="display:none">
  <div class="conf-modal">
    <h2 id="conf-title"></h2>
    <p id="conf-msg"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end" id="conf-btns"></div>
  </div>

<script>
'use strict';
// ── THEME ────────────────────────────────────────────────────
function setTheme(t,el){
  document.body.setAttribute('data-theme',t==='pink'?'':t);
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  if(el)el.classList.add('active');
  localStorage.setItem('cc-theme',t);
}
function toggleThemePanel(){
  document.getElementById('theme-panel').classList.toggle('open');
}
document.addEventListener('pointerdown',function(e){
  if(!document.querySelector('.theme-wrap').contains(e.target))
    document.getElementById('theme-panel').classList.remove('open');
});
(function(){
  var t=localStorage.getItem('cc-theme')||'pink';
  if(t!=='pink') document.body.setAttribute('data-theme',t);
  document.addEventListener('DOMContentLoaded',function(){
    var el=document.querySelector('.sw-'+t);
    if(el){document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));el.classList.add('active');}
  });
})();

// ── DATA ─────────────────────────────────────────────────────
var DB='crushcal3';
var data=JSON.parse(localStorage.getItem(DB)||'{"persons":[],"entries":[]}');
function save(){localStorage.setItem(DB,JSON.stringify(data));}

var personColors=['#e8698a','#9b6fd4','#3daa88','#e88a50','#4a9fd4','#c0496d','#7b5ea7','#2d8a68','#b06030','#1860a0'];
function getColor(p){return p.color||personColors[0];}

// ── TABS ─────────────────────────────────────────────────────
function movePill(animate){
  var pill=document.getElementById('tab-pill');
  var el=document.querySelector('.tab-item.active');
  if(!pill||!el)return;
  if(!animate)pill.classList.add('no-anim');
  pill.style.left=el.offsetLeft+'px';
  pill.style.width=el.offsetWidth+'px';
  if(!animate){void pill.offsetWidth;pill.classList.remove('no-anim');}
}
window.addEventListener('load',function(){movePill(false);});
window.addEventListener('resize',function(){movePill(false);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){movePill(false);});

function showTab(tab,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  el.classList.add('active');
  movePill(true);
  if(tab==='home') renderHome();
  if(tab==='cal')  {calPersonId=data.persons.length?data.persons[0].id:null; renderCal();}
  if(tab==='stats') renderStats();
}

// ── HOME ─────────────────────────────────────────────────────
var showAddForm=false, selColor=personColors[0];

function renderHome(){
  var grid=document.getElementById('persons-grid');
  var addArea=document.getElementById('add-area');

  if(!data.persons.length&&!showAddForm){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-line"></div><p>片思い中の人がいません<br>下から追加してみよう</p></div>';
  } else {
    grid.innerHTML=data.persons.map(function(p,i){
      var days=getDays(p.since);
      var sorted=data.entries.filter(e=>e.personId===p.id).sort((a,b)=>b.date.localeCompare(a.date));
      var lastLike=sorted.length?sorted[0].like:null;
      var c=getColor(p);
      return '<div class="person-card" onclick="goCal(\''+p.id+'\')" onpointerenter="this.classList.add(\'lifted\')" onpointerleave="this.classList.remove(\'lifted\')">'
        +'<button class="del-btn" onclick="delPerson('+i+',event)" aria-label="削除">✕</button>'
        +avatarHtml(p,c)
        +'<div class="p-name">'+esc(p.name)+'<span class="p-rel">'+esc(p.rel||'片思い')+'</span></div>'
        +'<div class="p-since">'+fmtDate(p.since)+'から</div>'
        +'<div class="p-days">'+days+'<span> 日間</span></div>'
        +'<div class="p-like">最新の好き度: '+(lastLike!==null?lastLike+'/100':'—')+'</div>'
        +'<div class="p-mile">'+mileStr(days)+'</div>'
        +'<button class="p-quick" style="--qc:'+c+'" onclick="quickToday(\''+p.id+'\',event)">今日を記録</button>'
        +((p.rel||'片思い')==='片思い'?'<button class="p-mutual" onclick="askMutual(\''+p.id+'\',event)">両思いになった</button>':'')
        +'</div>';
    }).join('');
  }

  if(showAddForm){
    var colorPick=personColors.map(function(c,ci){
      return '<span class="color-opt'+(c===selColor?' selected':'')+'" data-color="'+c+'" style="background:'+c+'" onclick="pickColor(this)"></span>';
    }).join('');
    addArea.innerHTML='<div class="add-card">'
      +'<h2>新しい片思いを追加</h2>'
      +'<div class="form-row">'
        +'<div class="form-group"><label>呼び名</label><input type="text" id="n-name" placeholder="例：Kくん、花ちゃん" autocomplete="off"></div>'
        +'<div class="form-group"><label>好きになった日</label><input type="date" id="n-since" value="'+today()+'"></div>'
      +'</div>'
      +'<div class="form-group" style="margin-bottom:12px"><label>出会った日（任意）</label><input type="date" id="n-met"></div>'
      +'<div class="form-row"><div class="form-group"><label>関係</label><select class="sel" id="n-rel">'+relOpts()+'</select></div><div class="form-group"><label>アイコン（任意）</label><input type="file" id="n-icon" accept="image/*" class="file-in"></div></div>'
      +'<div class="form-group" style="margin-bottom:16px"><label>カラー</label><div class="color-row">'+colorPick+'</div></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
        +'<button class="btn btn-primary" onclick="addPerson()">追加する</button>'
        +'<button class="btn btn-secondary" onclick="showAddForm=false;renderHome()">キャンセル</button>'
      +'</div></div>';
  } else {
    addArea.innerHTML='<button class="btn-add-new" onclick="showAddForm=true;renderHome()">＋ 新しい片思いを追加する</button>';
  }
}

function pickColor(el){
  selColor=el.dataset.color;
  document.querySelectorAll('.color-opt').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}
function addPerson(){
  var name=document.getElementById('n-name').value.trim();
  var since=document.getElementById('n-since').value;
  var met=document.getElementById('n-met').value;
  if(!name){alert('呼び名を入力してね');return;}
  if(!since){alert('好きになった日を選んでね');return;}
  data.persons.push({id:Date.now().toString(),name:name,since:since,met:met||null,color:selColor});
  save(); showAddForm=false; selColor=personColors[0]; renderHome();
}
function delPerson(i,e){
  e.stopPropagation();
  var p=data.persons[i];
  showConf(p.name+' を削除しますか？','関連する記録もすべて削除されます。',[
    {label:'キャンセル',cls:'btn-secondary',fn:closeConf},
    {label:'削除する',cls:'btn-primary',fn:function(){
      data.entries=data.entries.filter(d=>d.personId!==p.id);
      data.persons.splice(i,1); save(); closeConf(); renderHome();
    }}
  ]);
}

// ── CALENDAR ─────────────────────────────────────────────────
var calPersonId=null;
var calYear=new Date().getFullYear(), calMonth=new Date().getMonth();

function renderCal(){
  var tabsEl=document.getElementById('cal-person-tabs');
  if(!data.persons.length){
    tabsEl.innerHTML='';
    document.getElementById('cal-grid-wrap').innerHTML='<div class="empty"><div class="empty-line"></div><p>先に片思い中の人を追加してね</p></div>';
    document.getElementById('month-label').textContent='';
    return;
  }
  if(!calPersonId||!data.persons.find(p=>p.id===calPersonId)) calPersonId=data.persons[0].id;
  tabsEl.innerHTML=data.persons.map(function(p){
    var c=getColor(p), active=p.id===calPersonId;
    return '<button class="cal-tab'+(active?' active':'')+'" style="'
      +(active?'background:'+c+';border-color:'+c+';':'')+'" onclick="selectCalPerson(\''+p.id+'\')">'
      +'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+(active?'rgba(255,255,255,0.9)':c)+';flex-shrink:0"></span>'
      +esc(p.name)+'</button>';
  }).join('');
  renderCalGrid();
}
function selectCalPerson(id){calPersonId=id;renderCal();}
function changeMonth(d){
  // instant feedback, then re-render
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0) {calMonth=11;calYear--;}
  renderCalGrid();
}
function renderCalGrid(){
  var person=data.persons.find(p=>p.id===calPersonId);
  var c=person?getColor(person):null;
  document.getElementById('month-label').textContent=calYear+'年 '+(calMonth+1)+'月';
  var wrap=document.getElementById('cal-grid-wrap');
  var td=today(), firstDay=new Date(calYear,calMonth,1).getDay(), dim=new Date(calYear,calMonth+1,0).getDate();

  var html='<div class="cal-grid">';
  ['日','月','火','水','木','金','土'].forEach(d=>html+='<div class="cal-dow">'+d+'</div>');
  for(var i=0;i<firstDay;i++) html+='<div class="cal-cell empty"></div>';

  for(var day=1;day<=dim;day++){
    var ds=calYear+'-'+pad(calMonth+1)+'-'+pad(day);
    var dow=(firstDay+day-1)%7;
    var entries=data.entries.filter(e=>e.personId===calPersonId&&e.date===ds);
    var last=entries.length?entries[entries.length-1]:null;
    var isMet=person&&person.met===ds, isSince=person&&person.since===ds;
    var cls='cal-cell'+(dow===0?' sun':dow===6?' sat':'')+(ds===td?' today':'')+(last?' has-entry':'');
    html+='<div class="'+cls+'" onclick="openDay(\''+ds+'\')">';
    html+='<div class="cal-date">'+day
      +(isMet?'<span class="cal-mark" style="background:'+(c||'var(--rose)')+'">会</span>':'')
      +(isSince&&!isMet?'<span class="cal-mark" style="background:var(--blush)">好</span>':'')
      +'</div>';
    if(last){
      if(last.photo){
        html+='<img class="cal-thumb" src="'+last.photo+'" alt="">';
      } else {
        if(last.mood) html+='<div class="cal-mood-text">'+esc(last.mood)+'</div>';
        if(last.like){
          html+='<div class="cal-like-bar"><div class="cal-like-fill" style="width:'+last.like+'%"></div></div>';
        }
      }
    }
    html+='</div>';
  }
  html+='</div>';
  if(person){
    html+='<div class="cal-legend">';
    html+='<span><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--rose)"></span>記録あり</span>';
    if(person.since) html+='<span><span class="cal-mark" style="background:var(--blush);width:10px;height:10px;font-size:.44rem;line-height:10px;">好</span>好きになった日</span>';
    if(person.met)   html+='<span><span class="cal-mark" style="background:'+(c||'var(--rose)')+';width:10px;height:10px;font-size:.44rem;line-height:10px;">会</span>出会った日</span>';
    html+='</div>';
  }
  wrap.innerHTML=html;
}

    +'<div class="like-row">'
    +'<span class="like-lbl">低</span>'
    +'<input type="range" id="dm-like" min="1" max="100" value="70" oninput="document.getElementById(\'dlv\').textContent=this.value">'
    +'<span class="like-lbl">高</span>'
    +'<span class="like-val" id="dlv">70</span>'
    +'</div>'
    +'<label style="font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:block;margin:10px 0 4px;">日記</label>'
    +'<textarea id="dm-text" placeholder="今日あったこと、感じた気持ち…" style="margin-bottom:10px;width:100%;"></textarea>'
    +'<label style="font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:6px;">写真</label>'
    +'<div class="photo-upload"><label for="dm-ph">写真を選ぶ</label><input type="file" id="dm-ph" accept="image/*" onchange="handlePhoto(this)"></div>'
    +'<img id="dm-prev" style="display:none;width:100%;border-radius:12px;margin-top:8px;max-height:150px;object-fit:cover;">'

function dmSelectMood(el,mood){
  dmMood=mood;
  document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function handlePhoto(input){
  var file=input.files[0]; if(!file)return;

    var img=document.getElementById('dm-prev');
    img.src=dmPhotoB64; img.style.display='block';

function saveEntry(){
  var like=parseInt(document.getElementById('dm-like').value);
  var text=document.getElementById('dm-text').value.trim();

  save(); closeDayModal(); renderCalGrid();
}
function delEntry(id){
  data.entries=data.entries.filter(e=>e.id!==id);
  save(); openDay(dmDate); renderCalGrid();
}
function closeDayModal(){
  var ov=document.getElementById('day-overlay');
  var modal=document.getElementById('day-modal-inner');

// ── STATS ─────────────────────────────────────────────────────
function renderStats(){
  var el=document.getElementById('stats-content');
  if(!data.persons.length){
    el.innerHTML='<div class="empty"><div class="empty-line"></div><p>片思い中の人を追加すると統計が見られます</p></div>';
    return;
  }
  var totalDays=data.persons.reduce((s,p)=>s+getDays(p.since),0);
  var html='<div class="stats-grid">'
    +'<div class="stat-card"><div class="stat-num">'+data.persons.length+'</div><div class="stat-label">登録した人数</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+totalDays+'</div><div class="stat-label">合計片思い日数</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+data.entries.length+'</div><div class="stat-label">記録の数</div></div>'
    +'</div>';
  data.persons.forEach(function(p){
    var ents=data.entries.filter(e=>e.personId===p.id).sort((a,b)=>a.date.localeCompare(b.date));
    var last=ents.length?ents[ents.length-1].like:null;
    var first=ents.length?ents[0].like:null;
    var diff=last!==null&&first!==null?last-first:null;
    var diffStr=diff===null?'':diff>0?'▲'+diff:diff<0?'▼'+Math.abs(diff):'変化なし';
    var diffColor=diff>0?'var(--rose)':diff<0?'var(--muted)':'var(--sub)';
    var c=getColor(p);
    html+='<div class="person-stat">'
      +'<div class="ps-header">'
      +'<span class="ps-name"><span class="ps-dot" style="background:'+c+'"></span>'+esc(p.name)+'</span>'
      +'<span style="font-size:.72rem;color:'+diffColor+'">'+diffStr+'</span>'
      +'</div>'
      +'<div class="ps-days">好きになってから '+getDays(p.since)+' 日間'+(p.met?' ／ 出会った日: '+fmtDate(p.met):'')+'</div>'
      +(last!==null
        ?'<div class="like-bar"><div class="like-fill" style="width:'+last+'%"></div></div>'
         +'<div style="font-size:.68rem;color:var(--muted)">最新: '+last+'/100 ／ 記録 '+ents.length+'件</div>'
        :'<div style="font-size:.68rem;color:var(--muted);margin-top:6px">まだ記録がありません</div>')
      +'</div>';
  });
  el.innerHTML=html;
}

function showConf(title,msg,btns){

function closeConf(e){

}

// ── HELPERS ───────────────────────────────────────────────────
function today(){return new Date().toISOString().split('T')[0];}
function pad(n){return n<10?'0'+n:''+n;}
function getDays(s){return Math.max(0,Math.floor((new Date()-new Date(s))/86400000));}
function fmtDate(d){if(!d)return'';var p=d.split('-');return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── v4 ──────────────────────────────────────────────────────
function setTheme(t){

}

function goCal(id){showTab('cal',document.getElementById('ti-cal'));calPersonId=id;renderCal();}
function goToday(){

function handlePhoto(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,900/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      dmPhotoB64=c.toDataURL('image/jpeg',.82);
      var p=document.getElementById('dm-prev');p.src=dmPhotoB64;p.style.display='block';
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

  m.style.animation='none';
  m.style.transition='transform .28s cubic-bezier(.4,0,1,1),opacity .22s ease';
  m.style.transform='translateY(100%)';m.style.opacity='.4';
  setTimeout(function(){ov.style.display='none';m.style.transition='';m.style.transform='';m.style.opacity='';m.style.animation='';},280);
}

function closeBk(){closeSheet('bk-overlay');}

// ── backup ──
function openBackup(){
  var photos=data.entries.filter(function(e){return e.photo;}).length;
  var last=localStorage.getItem('cc-lastbackup');
  var kb=Math.round(JSON.stringify(data).length/1024);
  document.getElementById('bk-body').innerHTML=
    '<div class="esec"><div class="esec-title">現在のデータ</div><div class="exist-card" style="line-height:1.9;font-size:.82rem">片思い '+data.persons.length+'人 ／ 記録 '+data.entries.length+'件 ／ 写真 '+photos+'枚<br><span style="color:var(--muted)">サイズ 約'+kb+'KB ／ '+(last?'最後の書き出し '+fmtDate(last.slice(0,10)):'まだ書き出していません')+'</span></div></div>'
    +'<p style="font-size:.76rem;color:var(--muted);line-height:1.7;margin-bottom:14px">データはこの端末のブラウザ内にだけ保存されています。機種変更やブラウザのデータ削除に備えて、ときどき書き出しておくと安心です。</p>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="exportData()">書き出す</button><label class="btn btn-secondary" style="cursor:pointer">読み込む<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div>';
  var ov=document.getElementById('bk-overlay');ov.style.display='flex';
  ov.onclick=function(e){if(e.target===ov)closeBk();};
}
function exportData(){
  var obj={app:'crush-calendar',version:1,exportedAt:new Date().toISOString(),theme:localStorage.getItem('cc-theme')||'pink',persons:data.persons,entries:data.entries,settings:data.settings};
  var name='kataomoi-backup-'+today()+'.json';
  var blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  function done(){localStorage.setItem('cc-lastbackup',new Date().toISOString());openBackup();}
  var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(x){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'片思いカレンダー バックアップ'}).then(done).catch(function(){});
  }else{
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500);done();
  }
}
function importData(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    var o;try{o=JSON.parse(e.target.result);}catch(x){alert('ファイルを読み込めませんでした');return;}
    if(!o||!Array.isArray(o.persons)||!Array.isArray(o.entries)){alert('片思いカレンダーのバックアップではありません');return;}
    showConf('バックアップを読み込みますか？','ファイル内：片思い'+o.persons.length+'人 / 記録'+o.entries.length+'件。「統合」は今のデータに足し、「置き換え」は今のデータを消してファイルの内容にします。',[
      {label:'キャンセル',cls:'btn-secondary',fn:closeConf},
      {label:'統合',cls:'btn-secondary',fn:function(){mergeIn(o,false);}},
      {label:'置き換え',cls:'btn-primary',fn:function(){mergeIn(o,true);}}
    ]);
  };
  r.readAsText(f);input.value='';
}
function mergeIn(o,replace){
  if(replace){data={persons:o.persons,entries:o.entries,settings:Object.assign({icons:true,celebrate:true,style:"heart"},o.settings||{})};}
  else{
    var pid={},eid={};

function mileStr(d){
  var L=[100,200,300,365,500,730,1000,1095,1500,2000,3000],n=null;
  for(var i=0;i<L.length;i++){if(L[i]>d){n=L[i];break;}}
  if(n===null)n=(Math.floor(d/365)+1)*365;
  return (n%365===0?(n/365)+'年':n+'日')+'まであと'+(n-d)+'日';
}
function streak(id){

  if(!s[k(d)])d.setDate(d.getDate()-1);

  return n;
}

function reachedMile(d){
  var best=0;[100,200,300,365,500,730,1000,1095,1500,2000,3000].forEach(function(m){if(m<=d&&m>best)best=m;});
  var y=Math.floor(d/365)*365;return y>best?y:best;
}
function mlabel(m){return m%365===0?(m/365)+'年':m+'日';}
function checkMiles(){
  var ev=[],ch=false;
  data.persons.forEach(function(p){var r=reachedMile(getDays(p.since));
    if(p.mileDone===undefined){p.mileDone=r;ch=true;}
    else if(r>p.mileDone&&data.settings.mileEvent){p.mileDone=r;ch=true;ev.push(p.name+'さん '+mlabel(r));}});
  if(ch)save();
  if(ev.length){try{burst();}catch(e){}showConf('記念日おめでとう！','好きになってから '+ev.join('、')+' になりました。',[{label:'ありがとう',cls:'btn-primary',fn:closeConf}]);}
}

// image crop
var _ci=compressImg;
compressImg=function(f,m,sq,cb){if(!sq)return _ci(f,m,sq,cb);openCrop(f,Math.max(m,240),cb);};
function openCrop(f,m,cb){
  var url=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var V=Math.min(280,innerWidth-80),w=im.width,hh=im.height,base=V/Math.min(w,hh),z=1,ox=0,oy=0;
    var ov=document.createElement('div');ov.className='overlay center';ov.style.zIndex=700;
    ov.innerHTML='<div class="conf-modal" style="max-width:340px;text-align:center"><h2>トリミング</h2><p style="margin-bottom:12px">ドラッグで位置、スライダーで拡大します</p><canvas class="crop-c" width="'+V+'" height="'+V+'"></canvas><input type="range" min="1" max="4" step="0.01" value="1" style="width:80%;margin:14px 0 4px;accent-color:var(--rose)"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn btn-secondary" data-a="c">キャンセル</button><button class="btn btn-primary" data-a="o">決定</button></div></div>';
    document.body.appendChild(ov);
    var cv=ov.querySelector('canvas'),cx=cv.getContext('2d'),sl=ov.querySelector('input');
    function sW(){return w*base*z;}function sH(){return hh*base*z;}
    function clamp(){ox=Math.min(0,Math.max(V-sW(),ox));oy=Math.min(0,Math.max(V-sH(),oy));}
    ox=(V-sW())/2;oy=(V-sH())/2;
    function draw(){cx.clearRect(0,0,V,V);cx.drawImage(im,ox,oy,sW(),sH());
      cx.save();cx.fillStyle='rgba(20,8,14,.5)';cx.beginPath();cx.rect(0,0,V,V);cx.arc(V/2,V/2,V/2-4,0,Math.PI*2,true);cx.fill('evenodd');cx.restore();
      cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=2;cx.beginPath();cx.arc(V/2,V/2,V/2-4,0,Math.PI*2);cx.stroke();}
    function setZ(nz){var a=(V/2-ox)/sW(),b=(V/2-oy)/sH();z=nz;ox=V/2-a*sW();oy=V/2-b*sH();clamp();draw();}
    sl.oninput=function(){setZ(+sl.value);};
    var ps={};
    cv.onpointerdown=function(e){cv.setPointerCapture(e.pointerId);ps[e.pointerId]=[e.clientX,e.clientY];};
    cv.onpointermove=function(e){var p=ps[e.pointerId];if(!p)return;var ids=Object.keys(ps);
      if(ids.length===2){var a=ps[ids[0]],b=ps[ids[1]];ps[e.pointerId]=[e.clientX,e.clientY];var a2=ps[ids[0]],b2=ps[ids[1]];
        var d1=Math.hypot(a[0]-b[0],a[1]-b[1]),d2=Math.hypot(a2[0]-b2[0],a2[1]-b2[1]);
        if(d1>0){var nz=Math.min(4,Math.max(1,z*d2/d1));sl.value=nz;setZ(nz);}return;}
      ox+=e.clientX-p[0];oy+=e.clientY-p[1];ps[e.pointerId]=[e.clientX,e.clientY];clamp();draw();};
    cv.onpointerup=cv.onpointercancel=function(e){delete ps[e.pointerId];};
    function close(){ov.remove();URL.revokeObjectURL(url);}
    ov.querySelector('[data-a=c]').onclick=close;
    ov.querySelector('[data-a=o]').onclick=function(){var o=document.createElement('canvas');o.width=o.height=m;var k=m/V;
      o.getContext('2d').drawImage(im,ox*k,oy*k,sW()*k,sH()*k);close();cb(o.toDataURL('image/jpeg',.88));};
    draw();
  };
  im.src=url;
}
